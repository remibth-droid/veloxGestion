<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F3">
<title>Repas entre amis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --papier: #F2F5F3;
    --encre: #1F3A2E;
    --gris: #5C6B63;
    --trait: #D3DCD6;
    --vert: #137A45;
    --rouge: #C23B30;
    --titre: "Barlow Condensed", "Arial Narrow", "sans-serif-condensed", system-ui, sans-serif;
    --texte: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--papier);
    color: var(--encre);
    font: 400 17px/1.45 var(--texte);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  body.grand-ouvert { overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--vert); outline-offset: 3px; }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(34px + env(safe-area-inset-top)) 22px calc(40px + env(safe-area-inset-bottom));
  }
  h1 {
    margin: 0;
    font: 700 52px/0.95 var(--titre);
    letter-spacing: -0.005em;
  }
  .infos {
    margin: 12px 0 0;
    color: var(--gris);
    white-space: pre-line;
  }
  .chargement { margin: 36px 0 0; color: var(--gris); }

  .ecran { margin-top: 36px; }
  h2 {
    margin: 0 0 22px;
    font: 600 28px/1.1 var(--titre);
    overflow-wrap: anywhere;
  }

  /* ---------- Formulaire ---------- */
  .champ {
    display: block;
    min-width: 0;
    margin: 0 0 22px;
    padding: 0;
    border: 0;
  }
  .etiquette {
    display: block;
    margin: 0 0 8px;
    padding: 0;
    font-weight: 600;
  }
  .saisie {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 0 16px;
    border: 2px solid var(--trait);
    border-radius: 12px;
    background: #fff;
    font-size: 19px;
    font-weight: 500;
    -webkit-appearance: none;
    appearance: none;
  }
  .saisie::placeholder { color: #8A968F; }
  .saisie:focus { outline: none; border-color: var(--encre); }
  .saisie[readonly] { background: transparent; color: var(--gris); }
  .saisie::-webkit-date-and-time-value { text-align: left; }

  .puces {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 12px;
  }
  .puce {
    min-height: 42px;
    padding: 0 15px;
    border: 2px solid var(--trait);
    border-radius: 999px;
    background: #fff;
    font-weight: 500;
    cursor: pointer;
  }
  .puce[aria-pressed="true"] {
    background: var(--encre);
    border-color: var(--encre);
    color: #fff;
  }

  .erreur {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-left: 4px solid var(--rouge);
    border-radius: 2px 10px 10px 2px;
    background: #FBECEA;
    color: #8A2A21;
  }
  .page > .erreur { margin-top: 36px; }

  .bouton {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 58px;
    margin-top: 12px;
    padding: 0 18px;
    border: 0;
    border-radius: 16px;
    background: var(--encre);
    color: #fff;
    font-size: 19px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .bouton:active { transform: scale(.98); }
  .bouton:disabled { opacity: .55; cursor: default; transform: none; }
  .bouton.secondaire {
    border: 2px solid var(--encre);
    background: transparent;
    color: var(--encre);
  }
  .lien {
    display: block;
    margin: 14px auto 0;
    padding: 8px;
    border: 0;
    background: none;
    color: var(--gris);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ---------- Invitation ---------- */
  .affiche {
    overflow: hidden;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 0 0 1px var(--trait);
  }
  .affiche img {
    display: block;
    width: 100%;
    height: auto;
  }
  .affiche-attente {
    margin: 0;
    padding: 96px 24px;
    color: var(--gris);
    text-align: center;
  }
  .consigne {
    margin: 18px 0 6px;
    text-align: center;
    font-weight: 500;
  }
  .liens {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0 28px;
    margin-top: 10px;
  }
  .liens .lien { margin: 0; }

  /* ---------- QR code en grand ---------- */
  .grand-qr {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    background: #fff;
    cursor: pointer;
  }
  .grand-qr svg {
    display: block;
    width: min(88vw, 62vh, 440px);
    height: auto;
  }
  .grand-qr-nom {
    margin: 14px 0 0;
    font: 700 42px/1 var(--titre);
    text-align: center;
    overflow-wrap: anywhere;
  }
  .grand-qr .bouton {
    max-width: 320px;
    margin-top: 28px;
  }

  @media (prefers-reduced-motion: reduce) {
    .bouton { transition: none; }
  }
</style>
</head>
<body>

<main class="page">
  <header>
    <h1 id="titre">Repas entre amis</h1>
    <p class="infos" id="infos" hidden></p>
  </header>

  <p class="chargement" id="chargement">Chargement…</p>

  <!-- 1. Inscription : prénom, boisson, heure d'arrivée -->
  <form class="ecran" id="ecran-formulaire" novalidate hidden>
    <h2 id="titre-formulaire">Inscris-toi</h2>
    <label class="champ">
      <span class="etiquette">Ton prénom</span>
      <input class="saisie" id="prenom" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words">
    </label>
    <fieldset class="champ">
      <legend class="etiquette">Ta boisson</legend>
      <div class="puces" id="puces"></div>
      <input class="saisie" id="boisson" type="text" maxlength="40" autocomplete="off" placeholder="Ou écris la tienne" aria-label="Ta boisson">
    </fieldset>
    <label class="champ">
      <span class="etiquette">Ton heure d’arrivée</span>
      <input class="saisie" id="heure" type="time">
    </label>
    <p class="erreur" id="erreur-formulaire" role="alert" hidden></p>
    <button class="bouton" type="submit" id="bouton-valider">Recevoir mon invitation</button>
    <button class="lien" type="button" id="annuler" hidden>Annuler</button>
  </form>

  <!-- 2. L'affiche avec le QR code -->
  <section class="ecran" id="ecran-invitation" hidden>
    <h2 id="titre-invitation">Ton invitation</h2>
    <div class="affiche">
      <img id="affiche" alt="" hidden>
      <p class="affiche-attente" id="affiche-attente">Préparation de ton invitation…</p>
    </div>
    <p class="consigne">Garde-la : son QR code sera scanné à ton arrivée.</p>
    <button class="bouton" type="button" id="enregistrer" disabled>Enregistrer l’invitation</button>
    <button class="bouton secondaire" type="button" id="agrandir">Agrandir le QR code</button>
    <div class="liens">
      <button class="lien" type="button" id="modifier">Modifier mes infos</button>
      <button class="lien" type="button" id="pas-moi">Ce n’est pas moi</button>
    </div>
  </section>

  <p class="erreur" id="erreur-globale" role="alert" hidden></p>
</main>

<div class="grand-qr" id="grand-qr" role="dialog" aria-modal="true" aria-label="QR code en grand" hidden>
  <div id="grand-qr-code"></div>
  <p class="grand-qr-nom" id="grand-qr-nom"></p>
  <button class="bouton" type="button" id="fermer-grand">Fermer</button>
</div>

<script>
  // Si le script principal ne démarre pas (navigateur trop ancien), on le dit.
  setTimeout(function () {
    if (window.__repasDemarre) return;
    var p = document.getElementById("chargement");
    if (p) p.textContent = "Cette page a besoin d’un navigateur à jour (Safari, Chrome…). Mets-le à jour, puis réessaie.";
  }, 6000);
</script>

<script type="module">
  window.__repasDemarre = true;

  const SDK = "https://www.gstatic.com/firebasejs/10.12.2";
  const $ = (id) => document.getElementById(id);

  let fb = null;
  let db = null;
  let repas = { titre: "Repas entre amis", quand: "", ou: "", boissons: [] };
  let reglagesAffiche = { image: "affiche.png", qr: { x: 50, y: 80, taille: 28 } };
  let invite = null;   // { cle, prenom, boisson, heure, jeton }
  let image = null;    // { blob, url, nom }
  let enModification = false;
  let rendu = 0;

  // ---- QR-DEBUT : encodeur QR (mode alphanumérique, correction Q, versions 1 à 5) ----
  const qrMatrice = (() => {
    const ALNUM = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";
    const ECC = [0, 13, 22, 18, 26, 18];
    const BLOCS = [0, 1, 1, 2, 2, 4];
    const MASQUES = [
      (x, y) => (x + y) % 2,
      (x, y) => y % 2,
      (x, y) => x % 3,
      (x, y) => (x + y) % 3,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2,
      (x, y) => (x * y) % 2 + (x * y) % 3,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2,
    ];
    const bit = (v, i) => ((v >>> i) & 1) !== 0;
    const bruts = (v) => {
      let r = (16 * v + 128) * v + 64;
      if (v >= 2) {
        const k = Math.floor(v / 7) + 2;
        r -= (25 * k - 10) * k - 55;
      }
      return r;
    };
    const octetsDonnees = (v) => Math.floor(bruts(v) / 8) - ECC[v] * BLOCS[v];
    const gfMul = (x, y) => {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11d);
        z ^= ((y >>> i) & 1) * x;
      }
      return z;
    };
    const diviseur = (deg) => {
      const res = new Array(deg - 1).fill(0);
      res.push(1);
      let racine = 1;
      for (let k = 0; k < deg; k++) {
        for (let j = 0; j < deg; j++) {
          res[j] = gfMul(res[j], racine);
          if (j + 1 < deg) res[j] ^= res[j + 1];
        }
        racine = gfMul(racine, 2);
      }
      return res;
    };
    const reste = (data, div) => {
      const res = new Array(div.length).fill(0);
      for (const b of data) {
        const f = b ^ res.shift();
        res.push(0);
        div.forEach((c, i) => { res[i] ^= gfMul(c, f); });
      }
      return res;
    };

    return (entree) => {
      const texte = String(entree).toUpperCase();
      if (![...texte].every((c) => ALNUM.includes(c))) throw new Error("Caractère non pris en charge");
      const besoin = 13 + Math.floor(texte.length / 2) * 11 + (texte.length % 2 ? 6 : 0);
      let v = 1;
      while (v <= 5 && besoin > octetsDonnees(v) * 8) v++;
      if (v > 5) throw new Error("Texte trop long");
      const n = v * 4 + 17;
      const mod = Array.from({ length: n }, () => new Array(n).fill(false));
      const fixe = Array.from({ length: n }, () => new Array(n).fill(false));
      const poser = (x, y, sombre) => { mod[y][x] = sombre; fixe[y][x] = true; };

      // Bits de données
      const bits = [];
      const ajouter = (val, k) => { for (let i = k - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      ajouter(2, 4);
      ajouter(texte.length, 9);
      for (let i = 0; i + 1 < texte.length; i += 2) {
        ajouter(ALNUM.indexOf(texte[i]) * 45 + ALNUM.indexOf(texte[i + 1]), 11);
      }
      if (texte.length % 2) ajouter(ALNUM.indexOf(texte[texte.length - 1]), 6);
      const capacite = octetsDonnees(v) * 8;
      ajouter(0, Math.min(4, capacite - bits.length));
      ajouter(0, (8 - (bits.length % 8)) % 8);
      for (let pad = 0xec; bits.length < capacite; pad ^= 0xec ^ 0x11) ajouter(pad, 8);
      const donnees = new Array(bits.length / 8).fill(0);
      bits.forEach((b, i) => { donnees[i >>> 3] |= b << (7 - (i & 7)); });

      // Motifs fixes
      for (let i = 0; i < n; i++) {
        poser(6, i, i % 2 === 0);
        poser(i, 6, i % 2 === 0);
      }
      for (const [cx, cy] of [[3, 3], [n - 4, 3], [3, n - 4]]) {
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            const x = cx + dx;
            const y = cy + dy;
            if (x < 0 || x >= n || y < 0 || y >= n) continue;
            const d = Math.max(Math.abs(dx), Math.abs(dy));
            poser(x, y, d !== 2 && d !== 4);
          }
        }
      }
      if (v >= 2) {
        const p = n - 7;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) poser(p + dx, p + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
      const format = (masque) => {
        const d = (3 << 3) | masque;
        let r = d;
        for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
        const b = ((d << 10) | r) ^ 0x5412;
        for (let i = 0; i < 6; i++) poser(8, i, bit(b, i));
        poser(8, 7, bit(b, 6));
        poser(8, 8, bit(b, 7));
        poser(7, 8, bit(b, 8));
        for (let i = 9; i < 15; i++) poser(14 - i, 8, bit(b, i));
        for (let i = 0; i < 8; i++) poser(n - 1 - i, 8, bit(b, i));
        for (let i = 8; i < 15; i++) poser(8, n - 15 + i, bit(b, i));
        poser(8, n - 8, true);
      };
      format(0);

      // Correction d'erreurs et entrelacement
      const nb = BLOCS[v];
      const lecc = ECC[v];
      const total = Math.floor(bruts(v) / 8);
      const courts = nb - (total % nb);
      const lcourt = Math.floor(total / nb);
      const div = diviseur(lecc);
      const blocs = [];
      for (let i = 0, k = 0; i < nb; i++) {
        const bloc = donnees.slice(k, k + lcourt - lecc + (i < courts ? 0 : 1));
        k += bloc.length;
        const ecc = reste(bloc, div);
        if (i < courts) bloc.push(0);
        blocs.push(bloc.concat(ecc));
      }
      const mots = [];
      for (let i = 0; i < blocs[0].length; i++) {
        blocs.forEach((b, j) => { if (i !== lcourt - lecc || j >= courts) mots.push(b[i]); });
      }

      // Placement en zigzag
      let i = 0;
      for (let droite = n - 1; droite >= 1; droite -= 2) {
        if (droite === 6) droite = 5;
        const montant = ((droite + 1) & 2) === 0;
        for (let vert = 0; vert < n; vert++) {
          for (let j = 0; j < 2; j++) {
            const x = droite - j;
            const y = montant ? n - 1 - vert : vert;
            if (!fixe[y][x] && i < mots.length * 8) {
              mod[y][x] = bit(mots[i >>> 3], 7 - (i & 7));
              i++;
            }
          }
        }
      }

      // Choix du masque (pénalités de la norme)
      const appliquer = (m) => {
        const f = MASQUES[m];
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) if (!fixe[y][x] && f(x, y) === 0) mod[y][x] = !mod[y][x];
        }
      };
      const penalite = () => {
        let res = 0;
        const histo = (run, h) => {
          if (h[0] === 0) run += n;
          h.unshift(run);
          h.pop();
        };
        const motifs = (h) => {
          const k = h[1];
          const coeur = k > 0 && h[2] === k && h[4] === k && h[5] === k && h[3] === k * 3;
          return (coeur && h[0] >= k * 4 && h[6] >= k ? 1 : 0) + (coeur && h[6] >= k * 4 && h[0] >= k ? 1 : 0);
        };
        const ligne = (lire) => {
          let couleur = false;
          let run = 0;
          const h = [0, 0, 0, 0, 0, 0, 0];
          for (let k = 0; k < n; k++) {
            const c = lire(k);
            if (c === couleur) {
              run++;
              if (run === 5) res += 3;
              else if (run > 5) res++;
            } else {
              histo(run, h);
              if (!couleur) res += motifs(h) * 40;
              couleur = c;
              run = 1;
            }
          }
          if (couleur) {
            histo(run, h);
            run = 0;
          }
          histo(run + n, h);
          res += motifs(h) * 40;
        };
        for (let y = 0; y < n; y++) ligne((x) => mod[y][x]);
        for (let x = 0; x < n; x++) ligne((y) => mod[y][x]);
        for (let y = 0; y < n - 1; y++) {
          for (let x = 0; x < n - 1; x++) {
            const c = mod[y][x];
            if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) res += 3;
          }
        }
        let sombres = 0;
        for (const r of mod) for (const c of r) if (c) sombres++;
        const surface = n * n;
        res += (Math.ceil(Math.abs(sombres * 20 - surface * 10) / surface) - 1) * 10;
        return res;
      };
      let meilleur = 0;
      let minimum = Infinity;
      for (let m = 0; m < 8; m++) {
        appliquer(m);
        format(m);
        const p = penalite();
        if (p < minimum) {
          minimum = p;
          meilleur = m;
        }
        appliquer(m);
      }
      appliquer(meilleur);
      format(meilleur);
      return mod;
    };
  })();
  // ---- QR-FIN ----

  const MARGE_QR = 4;

  function qrSvg(texte) {
    const m = qrMatrice(texte);
    const t = m.length + MARGE_QR * 2;
    let d = "";
    m.forEach((ligne, y) => ligne.forEach((sombre, x) => {
      if (sombre) d += `M${x + MARGE_QR} ${y + MARGE_QR}h1v1h-1z`;
    }));
    return `<svg viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges" role="img" aria-label="QR code de ton invitation">`
      + `<rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  // ---------- Outils ----------
  const nettoyer = (t) => String(t ?? "").replace(/\s+/g, " ").trim();
  const insecable = (t) => t.replace(/(\d) ?h ?(\d{2})\b/g, "$1\u00A0h\u00A0$2").replace(/(\d) h\b/g, "$1\u00A0h");
  const chemin = (cle) => `repas/invites/${cle}`;
  const heureLisible = (h) => {
    const [hh, mm] = String(h).split(":");
    if (!mm) return String(h);
    return mm === "00" ? `${Number(hh)} h` : `${Number(hh)} h ${mm}`;
  };

  function cleDe(prenom) {
    const base = prenom.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    if (base) return base.slice(0, 40);
    return Array.from(prenom.toLowerCase(), (c) => c.codePointAt(0).toString(36)).join("-").slice(0, 40);
  }

  function genererJeton() {
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    return Array.from(crypto.getRandomValues(new Uint8Array(10)), (o) => alphabet[o & 31]).join("");
  }

  const estComplet = (d) => !!(d && d.prenom && d.jeton && d.boisson && d.heure);

  function montrer(nom) {
    $("chargement").hidden = true;
    for (const e of ["formulaire", "invitation"]) $(`ecran-${e}`).hidden = e !== nom;
    window.scrollTo(0, 0);
  }

  function afficherErreur(id, message) {
    const p = $(id);
    p.textContent = message || "";
    p.hidden = !message;
  }

  function panne(message) {
    $("chargement").hidden = true;
    for (const e of ["formulaire", "invitation"]) $(`ecran-${e}`).hidden = true;
    afficherErreur("erreur-globale", message);
  }

  function messageBase(err) {
    const t = String((err && (err.code || err.message)) || "").toLowerCase();
    if (t.includes("permission")) return "La base de données refuse l’inscription. Préviens l’organisateur du repas.";
    return "Connexion impossible. Vérifie ton réseau, puis réessaie.";
  }

  function memoriserDansUrl(cle) {
    try {
      const url = new URL(location.href);
      if (cle) url.searchParams.set("p", cle);
      else url.searchParams.delete("p");
      history.replaceState(null, "", url);
    } catch (e) {
      // aperçu sans historique : sans importance
    }
  }

  // ---------- Formulaire ----------
  function majPuces() {
    const v = nettoyer($("boisson").value).toLowerCase();
    for (const p of $("puces").children) p.setAttribute("aria-pressed", String(p.textContent.toLowerCase() === v));
  }

  $("puces").addEventListener("click", (e) => {
    const puce = e.target.closest(".puce");
    if (!puce) return;
    $("boisson").value = puce.textContent;
    majPuces();
    afficherErreur("erreur-formulaire", "");
  });
  $("boisson").addEventListener("input", majPuces);
  for (const id of ["prenom", "boisson", "heure"]) {
    $(id).addEventListener("input", () => afficherErreur("erreur-formulaire", ""));
  }

  function ouvrirFormulaire(modification) {
    enModification = modification;
    $("titre-formulaire").textContent = modification ? "Modifie tes infos" : "Inscris-toi";
    $("bouton-valider").textContent = modification ? "Enregistrer" : "Recevoir mon invitation";
    $("annuler").hidden = !modification;
    $("prenom").readOnly = modification;
    if (modification) {
      $("prenom").value = invite.prenom;
      $("boisson").value = invite.boisson;
      $("heure").value = invite.heure;
    }
    majPuces();
    afficherErreur("erreur-formulaire", "");
    montrer("formulaire");
  }

  $("annuler").addEventListener("click", () => afficherInvitation(false));

  $("ecran-formulaire").addEventListener("submit", async (e) => {
    e.preventDefault();
    afficherErreur("erreur-formulaire", "");
    const prenom = enModification ? invite.prenom : nettoyer($("prenom").value);
    const boisson = nettoyer($("boisson").value);
    const heure = $("heure").value;
    let probleme = null;
    if (!prenom) probleme = ["prenom", "Écris ton prénom."];
    else if (!boisson) probleme = ["boisson", "Choisis ou écris ta boisson."];
    else if (!/^[0-2]\d:[0-5]\d$/.test(heure)) probleme = ["heure", "Indique ton heure d’arrivée."];
    if (probleme) {
      afficherErreur("erreur-formulaire", probleme[1]);
      $(probleme[0]).focus();
      return;
    }

    const bouton = $("bouton-valider");
    const texte = bouton.textContent;
    bouton.textContent = "Un instant…";
    bouton.disabled = true;
    try {
      const cle = enModification ? invite.cle : cleDe(prenom);
      let ancien = enModification ? invite : null;
      if (!ancien) {
        const snap = await fb.get(fb.ref(db, chemin(cle)));
        ancien = snap.exists() ? snap.val() : null;
      }
      const fiche = {
        prenom: (ancien && ancien.prenom) || prenom,
        boisson,
        heure,
        jeton: (ancien && ancien.jeton) || genererJeton(),
      };
      await fb.update(fb.ref(db, chemin(cle)), fiche);
      invite = { cle, ...fiche };
      afficherInvitation(true);
    } catch (err) {
      afficherErreur("erreur-formulaire", messageBase(err));
    } finally {
      bouton.textContent = texte;
      bouton.disabled = false;
    }
  });

  // ---------- Invitation ----------
  function afficherInvitation(nouveau) {
    $("titre-invitation").textContent = nouveau
      ? `C’est noté, ${invite.prenom}\u00A0!`
      : `Ton invitation, ${invite.prenom}`;
    memoriserDansUrl(invite.cle);
    montrer("invitation");
    preparerImage();
  }

  $("modifier").addEventListener("click", () => ouvrirFormulaire(true));

  $("pas-moi").addEventListener("click", () => {
    invite = null;
    memoriserDansUrl(null);
    for (const id of ["prenom", "boisson", "heure"]) $(id).value = "";
    ouvrirFormulaire(false);
    $("prenom").focus();
  });

  function chargerImage(src) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => ko(new Error(`Image introuvable : ${src}`));
      img.src = src;
    });
  }

  function versBlob(canvas, type) {
    return new Promise((ok, ko) => {
      canvas.toBlob((b) => (b ? ok(b) : ko(new Error("Image impossible"))), type, 0.92);
    });
  }

  function rectangleArrondi(ctx, x, y, l, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + l, y, x + l, y + h, r);
    ctx.arcTo(x + l, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + l, y, r);
    ctx.closePath();
  }

  // L'affiche de l'organisateur, avec le QR code de l'invité posé dessus
  async function dessinerAffiche(inv) {
    const fichier = String(reglagesAffiche.image || "");
    if (!fichier) throw new Error("Pas d’affiche");
    const img = await chargerImage(new URL(fichier, location.href).href);
    const echelle = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const L = Math.round(img.naturalWidth * echelle);
    const H = Math.round(img.naturalHeight * echelle);
    const canvas = document.createElement("canvas");
    canvas.width = L;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, L, H);

    const { x = 50, y = 80, taille = 28 } = reglagesAffiche.qr || {};
    const matrice = qrMatrice(`REPAS-${inv.jeton}`);
    const modules = matrice.length + MARGE_QR * 2;
    const pas = Math.max(2, Math.floor((L * taille) / 100 / modules));
    const cote = pas * modules;
    const x0 = Math.round((L * x) / 100 - cote / 2);
    const y0 = Math.round((H * y) / 100 - cote / 2);
    ctx.fillStyle = "#FFFFFF";
    rectangleArrondi(ctx, x0, y0, cote, cote, pas * 1.5);
    ctx.fill();
    ctx.fillStyle = "#000000";
    matrice.forEach((ligne, j) => ligne.forEach((sombre, i) => {
      if (sombre) ctx.fillRect(x0 + (i + MARGE_QR) * pas, y0 + (j + MARGE_QR) * pas, pas, pas);
    }));

    const jpeg = /\.jpe?g$/i.test(fichier);
    return { blob: await versBlob(canvas, jpeg ? "image/jpeg" : "image/png"), ext: jpeg ? "jpg" : "png" };
  }

  // Invitation simple, utilisée tant que l'affiche n'est pas dans le dossier
  function ajusterPolice(ctx, texte, poids, famille, max, largeur) {
    let taille = max;
    do {
      ctx.font = `${poids} ${taille}px ${famille}`;
      if (ctx.measureText(texte).width <= largeur) break;
      taille -= 2;
    } while (taille > 24);
    return taille;
  }

  async function dessinerInvitation(inv) {
    try { await document.fonts.ready; } catch (e) { /* polices système */ }
    const L = 1080;
    const M = 80;
    const TITRE = "'Barlow Condensed', 'Arial Narrow', sans-serif";
    const TEXTE = "'Barlow', system-ui, sans-serif";
    const infos = [repas.quand, repas.ou].map(nettoyer).filter(Boolean).map(insecable);
    const matrice = qrMatrice(`REPAS-${inv.jeton}`);
    const modules = matrice.length + MARGE_QR * 2;
    const pas = Math.floor(640 / modules);
    const cote = pas * modules;

    const hTete = 72 + 92 + infos.length * 54 + 52;
    const hQr = 40 + cote + 40;
    const hCorps = 56 + 116 + 2 * 92 + 56;
    const canvas = document.createElement("canvas");
    canvas.width = L;
    canvas.height = hTete + hQr + hCorps;
    const ctx = canvas.getContext("2d");
    ctx.textBaseline = "top";

    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, L, canvas.height);

    ctx.fillStyle = "#1F3A2E";
    ctx.fillRect(0, 0, L, hTete);
    ctx.fillStyle = "#FFFFFF";
    ajusterPolice(ctx, repas.titre, 700, TITRE, 92, L - 2 * M);
    ctx.fillText(repas.titre, M, 72);
    ctx.fillStyle = "#CFE0D6";
    infos.forEach((ligne, i) => {
      ajusterPolice(ctx, ligne, 500, TEXTE, 40, L - 2 * M);
      ctx.fillText(ligne, M, 72 + 92 + 18 + i * 54);
    });

    const x0 = Math.round((L - cote) / 2);
    const y0 = hTete + 40;
    ctx.fillStyle = "#000000";
    matrice.forEach((ligne, y) => ligne.forEach((sombre, x) => {
      if (sombre) ctx.fillRect(x0 + (x + MARGE_QR) * pas, y0 + (y + MARGE_QR) * pas, pas, pas);
    }));

    const yPerfo = hTete + hQr;
    ctx.strokeStyle = "#D3DCD6";
    ctx.lineWidth = 4;
    ctx.setLineDash([18, 14]);
    ctx.beginPath();
    ctx.moveTo(M, yPerfo);
    ctx.lineTo(L - M, yPerfo);
    ctx.stroke();
    ctx.setLineDash([]);

    let y = yPerfo + 56;
    ctx.fillStyle = "#1F3A2E";
    ajusterPolice(ctx, inv.prenom, 700, TITRE, 116, L - 2 * M);
    ctx.fillText(inv.prenom, M, y);
    y += 116;

    for (const [etiquette, valeur] of [["Boisson", inv.boisson], ["Arrivée", heureLisible(inv.heure)]]) {
      ctx.fillStyle = "#D3DCD6";
      ctx.fillRect(M, y + 16, L - 2 * M, 2);
      ctx.font = `400 38px ${TEXTE}`;
      ctx.fillStyle = "#5C6B63";
      ctx.fillText(etiquette, M, y + 40);
      const largeurEtiquette = ctx.measureText(etiquette).width;
      ajusterPolice(ctx, valeur, 600, TEXTE, 44, L - 2 * M - largeurEtiquette - 40);
      ctx.fillStyle = "#1F3A2E";
      ctx.textAlign = "right";
      ctx.fillText(valeur, L - M, y + 36);
      ctx.textAlign = "left";
      y += 92;
    }

    return new Promise((ok, ko) => canvas.toBlob((b) => (b ? ok(b) : ko(new Error("Image impossible"))), "image/png"));
  }
  async function dessinerSecours(inv) {
    return { blob: await dessinerInvitation(inv), ext: "png" };
  }

  async function preparerImage() {
    const numero = ++rendu;
    const pour = { ...invite };
    const img = $("affiche");
    const attente = $("affiche-attente");
    $("enregistrer").disabled = true;
    img.hidden = true;
    attente.hidden = false;
    attente.textContent = "Préparation de ton invitation…";
    try {
      let resultat;
      try {
        resultat = await dessinerAffiche(pour);
      } catch (e) {
        console.info(`Affiche indisponible (${e.message}) : invitation simple à la place.`);
        resultat = await dessinerSecours(pour);
      }
      if (numero !== rendu) return;
      if (image) URL.revokeObjectURL(image.url);
      image = {
        blob: resultat.blob,
        url: URL.createObjectURL(resultat.blob),
        nom: `invitation-${pour.cle}.${resultat.ext}`,
      };
      img.alt = `Invitation de ${pour.prenom}, avec son QR code`;
      img.src = image.url;
      img.hidden = false;
      attente.hidden = true;
      $("enregistrer").disabled = false;
    } catch (e) {
      if (numero === rendu) attente.textContent = "L’image n’a pas pu être créée. Utilise « Agrandir le QR code ».";
    }
  }

  $("enregistrer").addEventListener("click", () => {
    if (!image) return;
    const fichier = new File([image.blob], image.nom, { type: image.blob.type });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      navigator.share({ files: [fichier], title: repas.titre }).catch(() => {});
      return;
    }
    const lien = document.createElement("a");
    lien.href = image.url;
    lien.download = image.nom;
    document.body.append(lien);
    lien.click();
    lien.remove();
  });

  // ---------- QR code en grand ----------
  function fermerGrand() {
    if ($("grand-qr").hidden) return;
    $("grand-qr").hidden = true;
    document.body.classList.remove("grand-ouvert");
    $("agrandir").focus();
  }

  $("agrandir").addEventListener("click", () => {
    $("grand-qr-code").innerHTML = qrSvg(`REPAS-${invite.jeton}`);
    $("grand-qr-nom").textContent = invite.prenom;
    $("grand-qr").hidden = false;
    document.body.classList.add("grand-ouvert");
    $("fermer-grand").focus();
  });
  $("grand-qr").addEventListener("click", fermerGrand);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerGrand(); });

  // ---------- Démarrage ----------
  function appliquerTextes() {
    document.title = repas.titre;
    $("titre").textContent = repas.titre;
    const infos = [repas.quand, repas.ou].map(nettoyer).filter(Boolean).map(insecable).join("\n");
    $("infos").textContent = infos;
    $("infos").hidden = !infos;
    const boissons = Array.isArray(repas.boissons) ? repas.boissons.map(nettoyer).filter(Boolean) : [];
    $("puces").replaceChildren(...boissons.map((nom) => {
      const puce = document.createElement("button");
      puce.type = "button";
      puce.className = "puce";
      puce.textContent = nom;
      puce.setAttribute("aria-pressed", "false");
      return puce;
    }));
    $("puces").hidden = boissons.length === 0;
  }

  const configRemplie = (c) => !!(c && c.apiKey && c.databaseURL && !/COLLE/i.test(`${c.apiKey}${c.databaseURL}`));

  async function demarrer() {
    let config;
    try {
      config = await import("./config.js");
    } catch (e) {
      panne("Le fichier config.js est introuvable. Il doit être dans le même dossier que cette page.");
      return;
    }
    repas = { ...repas, ...(config.repas || {}) };
    reglagesAffiche = { ...reglagesAffiche, ...(config.affiche || {}) };
    appliquerTextes();

    if (!configRemplie(config.firebaseConfig)) {
      panne("Le site n’est pas encore relié à sa base de données. Colle la config Firebase dans config.js.");
      return;
    }
    try {
      const [app, base] = await Promise.all([
        import(`${SDK}/firebase-app.js`),
        import(`${SDK}/firebase-database.js`),
      ]);
      fb = base;
      db = base.getDatabase(app.initializeApp(config.firebaseConfig));
    } catch (e) {
      panne("Le site n’arrive pas à se charger. Vérifie ta connexion, puis recharge la page.");
      return;
    }

    const cle = new URLSearchParams(location.search).get("p");
    if (cle && /^[a-z0-9-]{1,60}$/.test(cle)) {
      try {
        const snap = await fb.get(fb.ref(db, chemin(cle)));
        const d = snap.exists() ? snap.val() : null;
        if (estComplet(d)) {
          invite = { cle, prenom: d.prenom, boisson: d.boisson, heure: d.heure, jeton: d.jeton };
          afficherInvitation(false);
          return;
        }
      } catch (err) {
        ouvrirFormulaire(false);
        afficherErreur("erreur-formulaire", messageBase(err));
        return;
      }
      memoriserDansUrl(null);
    }
    ouvrirFormulaire(false);
  }

  demarrer();
</script>
