    color: var(--brun);
    font: 400 17px/1.5 var(--texte);
    font-variation-settings: "SOFT" 100;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-anchor: none;
  }
  @media (min-width: 720px) {
    body { background-size: 260px 260px; }
  }
  body.grand-ouvert { overflow: hidden; }
  button, input { font: inherit; color: inherit; font-variation-settings: inherit; }
  :focus-visible { outline: 3px solid var(--olive-fonce); outline-offset: 3px; }

  .scene {
    padding: calc(26px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
  }

  /* ---------- L'arche de l'invitation ---------- */
  .arche {
    --pad: calc(var(--l) * .07);
    position: relative;
    width: var(--l);
    margin: 0 auto;
    padding: 0 var(--pad);
    overflow: hidden;
    background: var(--creme);
    border: 3px solid var(--olive);
    border-radius: calc(var(--l) / 2) calc(var(--l) / 2) 0 0 / calc(var(--l) * .431) calc(var(--l) * .431) 0 0;
  }
  .titre {
    width: calc(var(--l) * .8144);
    margin: calc(var(--l) * .0713) 0 0 calc(var(--l) * .1338 - var(--pad) - 3px);
    line-height: 0;
  }
  .titre img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(.5px 1.5px 0 rgba(73, 64, 63, .14));
  }
  .date {
    margin: 4px 0 0;
    color: var(--olive);
    font-size: max(17px, calc(var(--l) * .058));
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: .02em;
    text-align: center;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .details {
    margin: 8px 0 0;
    color: var(--olive-fonce);
    line-height: 1.45;
    text-align: center;
    white-space: pre-line;
  }
  .chargement {
    margin: 28px 0 0;
    color: var(--brun-doux);
    text-align: center;
  }

  .ecran {
    margin-top: 30px;
    scroll-margin-top: 18px;
  }
  .ecran h2 {
    margin: 0;
    font-size: 27px;
    font-weight: 600;
    line-height: 1.15;
    text-align: center;
    overflow-wrap: anywhere;
  }
  .intro {
    margin: 6px 0 22px;
    color: var(--brun-doux);
    text-align: center;
  }

  /* ---------- Formulaire ---------- */
  .champ {
    display: block;
    min-width: 0;
    margin: 0 0 20px;
    padding: 0;
    border: 0;
  }
  .etiquette {
    display: block;
    margin: 0 0 8px;
    padding: 0;
    font-weight: 600;
  }
  .saisie {
    display: block;
    width: 100%;
    min-height: 54px;
    padding: 0 16px;
    border: 1.5px solid var(--olive);
    border-radius: 14px;
    background: var(--blanc);
    font-size: 18px;
    -webkit-appearance: none;
    appearance: none;
  }
  .saisie::placeholder { color: #7A6F69; }
  .saisie:focus {
    outline: none;
    border-color: var(--olive-fonce);
    box-shadow: 0 0 0 3px rgba(136, 133, 63, .28);
  }
  .saisie[readonly] {
    border-style: dashed;
    background: transparent;
    color: var(--brun-doux);
  }
  .saisie::-webkit-date-and-time-value { text-align: left; }

  .puces {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 12px;
  }
  .puce {
    min-height: 40px;
    padding: 0 14px;
    border: 1.5px solid var(--olive);
    border-radius: 999px;
    background: var(--blanc);
    font-size: 16px;
    cursor: pointer;
  }
  .puce[aria-pressed="true"] {
    border-color: var(--rose-fonce);
    background: var(--rose-fonce);
    color: #fff;
  }

  .erreur {
    margin: 0 0 14px;
    padding: 12px 14px;
    border-left: 4px solid #B4412F;
    border-radius: 3px 12px 12px 3px;
    background: #FBE4DE;
    color: #8C2E22;
  }
  .arche > .erreur { margin-top: 28px; }

  .bouton {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 56px;
    margin-top: 12px;
    padding: 0 20px;
    border: 0;
    border-radius: 999px;
    background: var(--olive-fonce);
    color: var(--creme);
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease;
  }
  .bouton:active { transform: scale(.98); }
  .bouton:disabled { opacity: .55; cursor: default; transform: none; }
  .bouton.secondaire {
    border: 1.5px solid var(--olive-fonce);
    background: transparent;
    color: var(--olive-fonce);
  }
  .lien {
    display: block;
    margin: 14px auto 0;
    padding: 8px;
    border: 0;
    background: none;
    color: var(--brun-doux);
    font-size: 16px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ---------- Invitation reçue ---------- */
  .carte {
    width: 92%;
    margin: 20px auto 0;
    transform: rotate(-1.6deg);
  }
  .carte img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(73, 64, 63, .2), 0 14px 26px -10px rgba(73, 64, 63, .38);
  }
  .carte-attente {
    display: grid;
    place-items: center;
    aspect-ratio: 210 / 297;
    margin: 0;
    padding: 16px;
    border: 1.5px dashed var(--olive);
    border-radius: 6px;
    color: var(--brun-doux);
    text-align: center;
  }
  .consigne {
    margin: 24px 0 4px;
    font-weight: 500;
    text-align: center;
  }
  .liens {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0 26px;
    margin-top: 8px;
  }
  .liens .lien { margin: 0; }

  .deco {
    display: block;
    width: calc(100% + 2 * var(--pad));
    max-width: none;
    height: auto;
    margin: 30px calc(-1 * var(--pad)) 0;
  }

  /* ---------- Pluie de pétales (une fois, quand l'invitation est prête) ---------- */
  .petales {
    position: fixed;
    inset: 0;
    z-index: 5;
    overflow: hidden;
    pointer-events: none;
  }
  .petale {
    position: absolute;
    top: -30px;
    width: var(--t);
    height: calc(var(--t) * .7);
    border-radius: 80% 0 80% 0;
    background: var(--c);
    opacity: 0;
    animation: chute var(--d) cubic-bezier(.35, .1, .65, 1) var(--r) forwards;
  }
  @keyframes chute {
    0% { opacity: 0; transform: translate(0, 0) rotate(var(--a0)); }
    8% { opacity: 1; }
    75% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--a1)); }
  }

  /* ---------- QR code en grand ---------- */
  .grand-qr {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    background: var(--creme);
    cursor: pointer;
  }
  .grand-qr-code {
    padding: 10px;
    border: 3px solid var(--olive);
    border-radius: 16px;
    background: #fff;
  }
  .grand-qr svg {
    display: block;
    width: min(78vw, 56vh, 420px);
    height: auto;
  }
  .grand-qr-nom {
    margin: 16px 0 0;
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    text-align: center;
    overflow-wrap: anywhere;
  }
  .grand-qr .bouton {
    max-width: 320px;
    margin-top: 26px;
  }

  @media (prefers-reduced-motion: reduce) {
    .bouton { transition: none; }
    .petales { display: none; }
  }
</style>
</head>

    <!-- 1. Inscription : prénom, boisson, heure d'arrivée -->
    <form class="ecran" id="ecran-formulaire" novalidate hidden>
      <h2 id="titre-formulaire">Inscris-toi</h2>
      <p class="intro" id="intro-formulaire">Remplis ces trois infos pour recevoir ton invitation.</p>
      <label class="champ">
        <span class="etiquette">Ton prénom</span>
        <input class="saisie" id="prenom" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words">
      </label>
      <fieldset class="champ">
        <legend class="etiquette">Ta boisson</legend>
        <div class="puces" id="puces"></div>
        <input class="saisie" id="boisson" type="text" maxlength="40" autocomplete="off" placeholder="Ou écris la tienne" aria-label="Ta boisson">
      </fieldset>
      <label class="champ">
        <span class="etiquette">Ton heure d’arrivée</span>
        <input class="saisie" id="heure" type="time">
      </label>
      <p class="erreur" id="erreur-formulaire" role="alert" hidden></p>
      <button class="bouton" type="submit" id="bouton-valider">Recevoir mon invitation</button>
      <button class="lien" type="button" id="annuler" hidden>Annuler</button>
    </form>

    <!-- 2. L'affiche avec le QR code -->
    <section class="ecran" id="ecran-invitation" hidden>
      <h2 id="titre-invitation">Ton invitation</h2>
      <div class="carte">
        <img id="affiche" alt="" hidden>
        <p class="carte-attente" id="affiche-attente">Préparation de ton invitation…</p>
      </div>
      <p class="consigne">Garde-la : son QR code sera scanné à ton arrivée.</p>
      <button class="bouton" type="button" id="enregistrer" disabled>Enregistrer l’invitation</button>
      <button class="bouton secondaire" type="button" id="agrandir">Agrandir le QR code</button>
      <div class="liens">
        <button class="lien" type="button" id="modifier">Modifier mes infos</button>
        <button class="lien" type="button" id="pas-moi">Ce n’est pas moi</button>
      </div>
    </section>

    };
    const diviseur = (deg) => {
      const res = new Array(deg - 1).fill(0);
      res.push(1);
      let racine = 1;
      for (let k = 0; k < deg; k++) {
        for (let j = 0; j < deg; j++) {
          res[j] = gfMul(res[j], racine);
          if (j + 1 < deg) res[j] ^= res[j + 1];
        }
        racine = gfMul(racine, 2);
      }
      return res;
    };
    const reste = (data, div) => {
      const res = new Array(div.length).fill(0);
      for (const b of data) {
        const f = b ^ res.shift();
        res.push(0);
        div.forEach((c, i) => { res[i] ^= gfMul(c, f); });
      }
      return res;
    };

    return (entree) => {
      const texte = String(entree).toUpperCase();
      if (![...texte].every((c) => ALNUM.includes(c))) throw new Error("Caractère non pris en charge");
      const besoin = 13 + Math.floor(texte.length / 2) * 11 + (texte.length % 2 ? 6 : 0);
      let v = 1;
      while (v <= 5 && besoin > octetsDonnees(v) * 8) v++;
      if (v > 5) throw new Error("Texte trop long");
      const n = v * 4 + 17;
      const mod = Array.from({ length: n }, () => new Array(n).fill(false));
      const fixe = Array.from({ length: n }, () => new Array(n).fill(false));
      const poser = (x, y, sombre) => { mod[y][x] = sombre; fixe[y][x] = true; };

      // Bits de données
      const bits = [];
      const ajouter = (val, k) => { for (let i = k - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
      ajouter(2, 4);
      ajouter(texte.length, 9);
      for (let i = 0; i + 1 < texte.length; i += 2) {
        ajouter(ALNUM.indexOf(texte[i]) * 45 + ALNUM.indexOf(texte[i + 1]), 11);
      }
      if (texte.length % 2) ajouter(ALNUM.indexOf(texte[texte.length - 1]), 6);
      const capacite = octetsDonnees(v) * 8;
      ajouter(0, Math.min(4, capacite - bits.length));
      ajouter(0, (8 - (bits.length % 8)) % 8);
      for (let pad = 0xec; bits.length < capacite; pad ^= 0xec ^ 0x11) ajouter(pad, 8);
      const donnees = new Array(bits.length / 8).fill(0);
      bits.forEach((b, i) => { donnees[i >>> 3] |= b << (7 - (i & 7)); });

      // Motifs fixes
      for (let i = 0; i < n; i++) {
        poser(6, i, i % 2 === 0);
        poser(i, 6, i % 2 === 0);
      }
      for (const [cx, cy] of [[3, 3], [n - 4, 3], [3, n - 4]]) {
        for (let dy = -4; dy <= 4; dy++) {
          for (let dx = -4; dx <= 4; dx++) {
            const x = cx + dx;
            const y = cy + dy;
            if (x < 0 || x >= n || y < 0 || y >= n) continue;
            const d = Math.max(Math.abs(dx), Math.abs(dy));
            poser(x, y, d !== 2 && d !== 4);
          }
        }
      }
      if (v >= 2) {
        const p = n - 7;
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) poser(p + dx, p + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
      const format = (masque) => {
        const d = (3 << 3) | masque;
        let r = d;
        for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
        const b = ((d << 10) | r) ^ 0x5412;
        for (let i = 0; i < 6; i++) poser(8, i, bit(b, i));
        poser(8, 7, bit(b, 6));
        poser(8, 8, bit(b, 7));
        poser(7, 8, bit(b, 8));
        for (let i = 9; i < 15; i++) poser(14 - i, 8, bit(b, i));
        for (let i = 0; i < 8; i++) poser(n - 1 - i, 8, bit(b, i));
        for (let i = 8; i < 15; i++) poser(8, n - 15 + i, bit(b, i));
        poser(8, n - 8, true);
      };
      format(0);

      // Correction d'erreurs et entrelacement
      const nb = BLOCS[v];
      const lecc = ECC[v];
      const total = Math.floor(bruts(v) / 8);
      const courts = nb - (total % nb);
      const lcourt = Math.floor(total / nb);
      const div = diviseur(lecc);
      const blocs = [];
      for (let i = 0, k = 0; i < nb; i++) {
        const bloc = donnees.slice(k, k + lcourt - lecc + (i < courts ? 0 : 1));
        k += bloc.length;
        const ecc = reste(bloc, div);
        if (i < courts) bloc.push(0);
        blocs.push(bloc.concat(ecc));
      }
      const mots = [];
      for (let i = 0; i < blocs[0].length; i++) {
        blocs.forEach((b, j) => { if (i !== lcourt - lecc || j >= courts) mots.push(b[i]); });
      }

      // Placement en zigzag
      let i = 0;
      for (let droite = n - 1; droite >= 1; droite -= 2) {
        if (droite === 6) droite = 5;
        const montant = ((droite + 1) & 2) === 0;
        for (let vert = 0; vert < n; vert++) {
          for (let j = 0; j < 2; j++) {
            const x = droite - j;
            const y = montant ? n - 1 - vert : vert;
            if (!fixe[y][x] && i < mots.length * 8) {
              mod[y][x] = bit(mots[i >>> 3], 7 - (i & 7));
              i++;
            }
          }
        }
      }

      // Choix du masque (pénalités de la norme)
      const appliquer = (m) => {
        const f = MASQUES[m];
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) if (!fixe[y][x] && f(x, y) === 0) mod[y][x] = !mod[y][x];
        }
      };
      const penalite = () => {
        let res = 0;
        const histo = (run, h) => {
          if (h[0] === 0) run += n;
          h.unshift(run);
          h.pop();
        };
        const motifs = (h) => {
          const k = h[1];
          const coeur = k > 0 && h[2] === k && h[4] === k && h[5] === k && h[3] === k * 3;
          return (coeur && h[0] >= k * 4 && h[6] >= k ? 1 : 0) + (coeur && h[6] >= k * 4 && h[0] >= k ? 1 : 0);
        };
        const ligne = (lire) => {
          let couleur = false;
          let run = 0;
          const h = [0, 0, 0, 0, 0, 0, 0];
          for (let k = 0; k < n; k++) {
            const c = lire(k);
            if (c === couleur) {
              run++;
              if (run === 5) res += 3;
              else if (run > 5) res++;
            } else {
              histo(run, h);
              if (!couleur) res += motifs(h) * 40;
              couleur = c;
              run = 1;
            }
          }
          if (couleur) {
            histo(run, h);
            run = 0;
          }
          histo(run + n, h);
          res += motifs(h) * 40;
        };
        for (let y = 0; y < n; y++) ligne((x) => mod[y][x]);
        for (let x = 0; x < n; x++) ligne((y) => mod[y][x]);
        for (let y = 0; y < n - 1; y++) {
          for (let x = 0; x < n - 1; x++) {
            const c = mod[y][x];
            if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) res += 3;
          }
        }
        let sombres = 0;
        for (const r of mod) for (const c of r) if (c) sombres++;
        const surface = n * n;
        res += (Math.ceil(Math.abs(sombres * 20 - surface * 10) / surface) - 1) * 10;
        return res;
      };
      let meilleur = 0;
      let minimum = Infinity;
      for (let m = 0; m < 8; m++) {
        appliquer(m);
        format(m);
        const p = penalite();
        if (p < minimum) {
          minimum = p;
          meilleur = m;
        }
        appliquer(m);
      }
      appliquer(meilleur);
      format(meilleur);
      return mod;
    };
  })();
  // ---- QR-FIN ----

  const MARGE_QR = 4;

  function qrSvg(texte) {
    const m = qrMatrice(texte);
    const t = m.length + MARGE_QR * 2;
    let d = "";
    m.forEach((ligne, y) => ligne.forEach((sombre, x) => {
      if (sombre) d += `M${x + MARGE_QR} ${y + MARGE_QR}h1v1h-1z`;
    }));
    return `<svg viewBox="0 0 ${t} ${t}" shape-rendering="crispEdges" role="img" aria-label="QR code de ton invitation">`
      + `<rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  // ---------- Outils ----------
  const nettoyer = (t) => String(t ?? "").replace(/\s+/g, " ").trim();
  const insecable = (t) => t.replace(/(\d) ?h ?(\d{2})\b/g, "$1\u00A0h\u00A0$2").replace(/(\d) ?h\b/g, "$1\u00A0h");
  const chemin = (cle) => `repas/invites/${cle}`;
  const heureLisible = (h) => {
    const [hh, mm] = String(h).split(":");
    if (!mm) return String(h);
    return mm === "00" ? `${Number(hh)} h` : `${Number(hh)} h ${mm}`;
  };

  function lignesDetails() {
    let lignes = [repas.heure, repas.lieu].map(nettoyer).filter(Boolean);
    if (!lignes.length && !nettoyer(repas.date)) lignes = [repas.quand, repas.ou].map(nettoyer).filter(Boolean);
    return lignes.map(insecable);
  }

  function cleDe(prenom) {
    const base = prenom.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    if (base) return base.slice(0, 40);
    return Array.from(prenom.toLowerCase(), (c) => c.codePointAt(0).toString(36)).join("-").slice(0, 40);
  }

  function genererJeton() {
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    return Array.from(crypto.getRandomValues(new Uint8Array(10)), (o) => alphabet[o & 31]).join("");
  }

  const estComplet = (d) => !!(d && d.prenom && d.jeton && d.boisson && d.heure);

  // ---------- Connexion à la base ----------
  // Si la base ne répond pas, Firebase réessaie en silence : on coupe au bout de 10 s.
  const ADRESSE_BASE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)?\.(firebaseio\.com|firebasedatabase\.app)\/?$/i;
  const DELAI_BASE = 10000;
  let adresseBase = "";

  function avecDelai(promesse) {
    let minuteur;
    const delai = new Promise((_, ko) => {
      minuteur = setTimeout(() => ko(Object.assign(new Error("Pas de réponse de la base"), { code: "delai" })), DELAI_BASE);
    });
    return Promise.race([promesse, delai]).finally(() => clearTimeout(minuteur));
  }

  function signalerSilence() {
    console.error(`Firebase ne répond pas (adresse : ${adresseBase}). Vérifie databaseURL dans config.js, ou ajoute ?debug à l’adresse de la page pour voir le détail.`);
  }

  function surveillerConnexion() {
    let connecte = false;
    fb.onValue(fb.ref(db, ".info/connected"), (snap) => {
      connecte = snap.val() === true;
      if (connecte) console.info(`Firebase connecté (${adresseBase}).`);
    });
    setTimeout(() => { if (!connecte) signalerSilence(); }, DELAI_BASE);
  }

  function montrer(nom, defiler = false) {
    $("chargement").hidden = true;
    for (const e of ["formulaire", "invitation"]) $(`ecran-${e}`).hidden = e !== nom;
    if (defiler) $(`ecran-${nom}`).scrollIntoView({ block: "start" });
    else window.scrollTo(0, 0);
  }

  function afficherErreur(id, message) {
    const p = $(id);
    p.textContent = message || "";
    p.hidden = !message;
  }

  function panne(message) {
    $("chargement").hidden = true;
    for (const e of ["formulaire", "invitation"]) $(`ecran-${e}`).hidden = true;
    afficherErreur("erreur-globale", message);
  }

  function messageBase(err) {
    const t = String((err && (err.code || err.message)) || "").toLowerCase();
    if (t.includes("permission")) return "La base de données refuse l’inscription. Préviens l’organisateur de la soirée.";
    if (t === "delai") {
      signalerSilence();
      return "La base de données ne répond pas. Vérifie ta connexion, puis réessaie.";
    }
    return "Connexion impossible. Vérifie ton réseau, puis réessaie.";
  }

  function memoriserDansUrl(cle) {
    try {
      const url = new URL(location.href);
      if (cle) url.searchParams.set("p", cle);
      else url.searchParams.delete("p");
      history.replaceState(null, "", url);
    } catch (e) {
      // aperçu sans historique : sans importance
    }
  }

  // ---------- Formulaire ----------
  function majPuces() {
    const v = nettoyer($("boisson").value).toLowerCase();
    for (const p of $("puces").children) p.setAttribute("aria-pressed", String(p.textContent.toLowerCase() === v));
  }

  $("puces").addEventListener("click", (e) => {
    const puce = e.target.closest(".puce");
    if (!puce) return;
    $("boisson").value = puce.textContent;
    majPuces();
    afficherErreur("erreur-formulaire", "");
  });
  $("boisson").addEventListener("input", majPuces);
  for (const id of ["prenom", "boisson", "heure"]) {
    $(id).addEventListener("input", () => afficherErreur("erreur-formulaire", ""));
  }

  function ouvrirFormulaire(modification) {
    enModification = modification;
    $("titre-formulaire").textContent = modification ? "Modifie tes infos" : "Inscris-toi";
    $("intro-formulaire").hidden = modification;
    $("bouton-valider").textContent = modification ? "Enregistrer" : "Recevoir mon invitation";
    $("annuler").hidden = !modification;
    $("prenom").readOnly = modification;
    if (modification) {
      $("prenom").value = invite.prenom;
      $("boisson").value = invite.boisson;
      $("heure").value = invite.heure;
    }
    majPuces();
    afficherErreur("erreur-formulaire", "");
    montrer("formulaire", modification);
  }

  $("annuler").addEventListener("click", () => afficherInvitation(false, true));

  $("ecran-formulaire").addEventListener("submit", async (e) => {
    e.preventDefault();
    afficherErreur("erreur-formulaire", "");
    const prenom = enModification ? invite.prenom : nettoyer($("prenom").value);
    const boisson = nettoyer($("boisson").value);
    const heure = $("heure").value;
    let probleme = null;
    if (!prenom) probleme = ["prenom", "Écris ton prénom."];
    else if (!boisson) probleme = ["boisson", "Choisis ou écris ta boisson."];
    else if (!/^[0-2]\d:[0-5]\d$/.test(heure)) probleme = ["heure", "Indique ton heure d’arrivée."];
    if (probleme) {
      afficherErreur("erreur-formulaire", probleme[1]);
      $(probleme[0]).focus();
      return;
    }

    const bouton = $("bouton-valider");
    const texte = bouton.textContent;
    bouton.textContent = "Un instant…";
    bouton.disabled = true;
    try {
      const cle = enModification ? invite.cle : cleDe(prenom);
      let ancien = enModification ? invite : null;
      if (!ancien) {
        const snap = await avecDelai(fb.get(fb.ref(db, chemin(cle))));
        ancien = snap.exists() ? snap.val() : null;
      }
      const premiere = !(ancien && ancien.jeton);
      const fiche = {
        prenom: (ancien && ancien.prenom) || prenom,
        boisson,
        heure,
        jeton: (ancien && ancien.jeton) || genererJeton(),
      };
      await avecDelai(fb.update(fb.ref(db, chemin(cle)), fiche));
      invite = { cle, ...fiche };
      afficherInvitation(true, true, premiere);
    } catch (err) {
      afficherErreur("erreur-formulaire", messageBase(err));
    } finally {
      bouton.textContent = texte;
      bouton.disabled = false;
    }
  });

  // ---------- Invitation ----------
  function afficherInvitation(confirme, defiler = false, fete = false) {
    $("titre-invitation").textContent = confirme
      ? `C’est noté, ${invite.prenom}\u00A0!`
      : `Ton invitation, ${invite.prenom}`;
    memoriserDansUrl(invite.cle);
    montrer("invitation", defiler);
    preparerImage();
    if (fete) lancerPetales();
  }

  $("modifier").addEventListener("click", () => ouvrirFormulaire(true));

  $("pas-moi").addEventListener("click", () => {
    invite = null;
    memoriserDansUrl(null);
    for (const id of ["prenom", "boisson", "heure"]) $(id).value = "";
    ouvrirFormulaire(false);
    $("prenom").focus();
  });

  function lancerPetales() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const couleurs = ["#F58992", "#F7B9AE", "#F49F8A", "#88853F", "#C9C27F"];
    const zone = $("petales");
    const hauteur = window.innerHeight;
    const petales = Array.from({ length: 22 }, (_, i) => {
      const p = document.createElement("span");
      p.className = "petale";
      p.style.left = `${Math.random() * 100}%`;
      p.style.setProperty("--t", `${10 + Math.random() * 10}px`);
      p.style.setProperty("--c", couleurs[i % couleurs.length]);
      p.style.setProperty("--d", `${1.9 + Math.random() * 1.1}s`);
      p.style.setProperty("--r", `${Math.random() * 0.5}s`);
      p.style.setProperty("--dx", `${(Math.random() - 0.5) * 120}px`);
      p.style.setProperty("--dy", `${hauteur * (0.55 + Math.random() * 0.4)}px`);
      p.style.setProperty("--a0", `${Math.random() * 360}deg`);
      p.style.setProperty("--a1", `${Math.random() * 720 - 360}deg`);
      return p;
    });
    zone.replaceChildren(...petales);
    setTimeout(() => zone.replaceChildren(), 3800);
  }

  function chargerImage(src) {
    return new Promise((ok, ko) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => ko(new Error(`Image introuvable : ${src}`));
      img.src = src;
    });
  }

  function versBlob(canvas, type) {
    return new Promise((ok, ko) => {
      canvas.toBlob((b) => (b ? ok(b) : ko(new Error("Image impossible"))), type, 0.92);
    });
  }

  function rectangleArrondi(ctx, x, y, l, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + l, y, x + l, y + h, r);
    ctx.arcTo(x + l, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + l, y, r);
    ctx.closePath();
  }

  function poserQr(ctx, texte, x0, y0, pas, couleur, fond) {
    const matrice = qrMatrice(texte);
    const cote = pas * (matrice.length + MARGE_QR * 2);
    ctx.fillStyle = fond;
    rectangleArrondi(ctx, x0, y0, cote, cote, pas * 1.5);
    ctx.fill();
    ctx.fillStyle = couleur;
    matrice.forEach((ligne, j) => ligne.forEach((sombre, i) => {
      if (sombre) ctx.fillRect(x0 + (i + MARGE_QR) * pas, y0 + (j + MARGE_QR) * pas, pas, pas);
    }));
  }

  // L'affiche de la soirée, avec le QR code de l'invité posé dans le cadre
  async function dessinerAffiche(inv) {
    const fichier = String(reglagesAffiche.image || "");
    if (!fichier) throw new Error("Pas d’affiche");
    const img = await chargerImage(new URL(fichier, location.href).href);
    const echelle = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
    const L = Math.round(img.naturalWidth * echelle);
    const H = Math.round(img.naturalHeight * echelle);
    const canvas = document.createElement("canvas");
    canvas.width = L;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, L, H);

    const { x = 50, y = 80, taille = 28, couleur = "#000000", fond = "#FFFFFF" } = reglagesAffiche.qr || {};
    const modules = qrMatrice(`REPAS-${inv.jeton}`).length + MARGE_QR * 2;
    const pas = Math.max(2, Math.floor((L * taille) / 100 / modules));
    const cote = pas * modules;
    poserQr(ctx, `REPAS-${inv.jeton}`, Math.round((L * x) / 100 - cote / 2), Math.round((H * y) / 100 - cote / 2), pas, couleur, fond);

    const jpeg = /\.jpe?g$/i.test(fichier);
    return { blob: await versBlob(canvas, jpeg ? "image/jpeg" : "image/png"), ext: jpeg ? "jpg" : "png" };
  }

  function ajusterPolice(ctx, texte, poids, famille, max, largeur) {
    let taille = max;
    do {
      ctx.font = `${poids} ${taille}px ${famille}`;
      if (ctx.measureText(texte).width <= largeur) break;
      taille -= 2;
    } while (taille > 20);
    return taille;
  }

  // Invitation simple, utilisée si l'affiche n'est pas dans le dossier
  async function dessinerSecours(inv) {
    try { await document.fonts.ready; } catch (e) { /* polices système */ }
    const titre = await chargerImage($("titre-image").src);
    const L = 1080;
    const M = 110;
    const POLICE = "'Fraunces', Georgia, serif";
    const date = nettoyer(repas.date).toUpperCase();
    const lignes = lignesDetails();
    const pas = Math.floor(520 / (qrMatrice(`REPAS-${inv.jeton}`).length + MARGE_QR * 2));
    const cote = pas * (qrMatrice(`REPAS-${inv.jeton}`).length + MARGE_QR * 2);
    const hTitre = Math.round((L - 2 * M) * titre.naturalHeight / titre.naturalWidth);
    const H = 90 + hTitre + 20 + (date ? 72 : 0) + lignes.length * 50 + 70 + cote + 70 + 100 + 2 * 56 + 110;

    const canvas = document.createElement("canvas");
    canvas.width = L;
    canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FBF4E4";
    ctx.fillRect(0, 0, L, H);
    ctx.strokeStyle = "#88853F";
    ctx.lineWidth = 8;
    ctx.strokeRect(34, 34, L - 68, H - 68);

    let y = 90;
    ctx.drawImage(titre, M, y, L - 2 * M, hTitre);
    y += hTitre + 20;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    if (date) {
      ctx.fillStyle = "#88853F";
      ajusterPolice(ctx, date, 700, POLICE, 56, L - 2 * M);
      ctx.fillText(date, L / 2, y);
      y += 72;
    }
    ctx.fillStyle = "#5E5C2A";
    for (const ligne of lignes) {
      ajusterPolice(ctx, ligne, 400, POLICE, 38, L - 2 * M);
      ctx.fillText(ligne, L / 2, y);
      y += 50;
    }
    y += 70;
    const x0 = Math.round((L - cote) / 2);
    ctx.strokeStyle = "#49403F";
    ctx.lineWidth = 3;
    ctx.setLineDash([12, 9]);
    ctx.strokeRect(x0 - 22, y - 22, cote + 44, cote + 44);
    ctx.setLineDash([]);
    poserQr(ctx, `REPAS-${inv.jeton}`, x0, y, pas, "#3B3230", "#FFFBF2");
    y += cote + 70;

    ctx.fillStyle = "#49403F";
    ajusterPolice(ctx, inv.prenom, 700, POLICE, 84, L - 2 * M);
    ctx.fillText(inv.prenom, L / 2, y);
    y += 100;
    ctx.fillStyle = "#6B605C";
    for (const ligne of [inv.boisson, `Arrivée à ${heureLisible(inv.heure)}`]) {
      ajusterPolice(ctx, ligne, 500, POLICE, 42, L - 2 * M);
      ctx.fillText(ligne, L / 2, y);
      y += 56;
    }
    return { blob: await versBlob(canvas, "image/png"), ext: "png" };
  }

  async function preparerImage() {
    const numero = ++rendu;
    const pour = { ...invite };
    const img = $("affiche");
    const attente = $("affiche-attente");
    $("enregistrer").disabled = true;
    img.hidden = true;
    attente.hidden = false;
    attente.textContent = "Préparation de ton invitation…";
    try {
      let resultat;
      try {
        resultat = await dessinerAffiche(pour);
      } catch (e) {
        console.info(`Affiche indisponible (${e.message}) : invitation simple à la place.`);
        resultat = await dessinerSecours(pour);
      }
      if (numero !== rendu) return;
      if (image) URL.revokeObjectURL(image.url);
      image = {
        blob: resultat.blob,
        url: URL.createObjectURL(resultat.blob),
        nom: `invitation-${pour.cle}.${resultat.ext}`,
      };
      img.alt = `Invitation de ${pour.prenom}, avec son QR code`;
      img.src = image.url;
      img.hidden = false;
      attente.hidden = true;
      $("enregistrer").disabled = false;
    } catch (e) {
      if (numero === rendu) attente.textContent = "L’image n’a pas pu être créée. Utilise « Agrandir le QR code ».";
    }
  }

  $("enregistrer").addEventListener("click", () => {
    if (!image) return;
    const fichier = new File([image.blob], image.nom, { type: image.blob.type });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      navigator.share({ files: [fichier], title: repas.titre }).catch(() => {});
      return;
    }
    const lien = document.createElement("a");
    lien.href = image.url;
    lien.download = image.nom;
    document.body.append(lien);
    lien.click();
    lien.remove();
  });

  // ---------- QR code en grand ----------
  function fermerGrand() {
    if ($("grand-qr").hidden) return;
    $("grand-qr").hidden = true;
    document.body.classList.remove("grand-ouvert");
    $("agrandir").focus();
  }

  $("agrandir").addEventListener("click", () => {
    $("grand-qr-code").innerHTML = qrSvg(`REPAS-${invite.jeton}`);
    $("grand-qr-nom").textContent = invite.prenom;
    $("grand-qr").hidden = false;
    document.body.classList.add("grand-ouvert");
    $("fermer-grand").focus();
  });
  $("grand-qr").addEventListener("click", fermerGrand);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerGrand(); });

  // ---------- Démarrage ----------
  function appliquerTextes() {
    document.title = repas.titre;
    $("titre-image").alt = repas.titre;
    const date = nettoyer(repas.date);
    $("date").textContent = date;
    $("date").hidden = !date;
    const lignes = lignesDetails();
    $("details").textContent = lignes.join("\n");
    $("details").hidden = !lignes.length;
    const boissons = Array.isArray(repas.boissons) ? repas.boissons.map(nettoyer).filter(Boolean) : [];
    $("puces").replaceChildren(...boissons.map((nom) => {
      const puce = document.createElement("button");
      puce.type = "button";
      puce.className = "puce";
      puce.textContent = nom;
      puce.setAttribute("aria-pressed", "false");
      return puce;
    }));
    $("puces").hidden = boissons.length === 0;
  }

  const configRemplie = (c) => !!(c && c.apiKey && c.databaseURL && !/COLLE/i.test(`${c.apiKey}${c.databaseURL}`));

  async function demarrer() {
    let config;
    try {
      config = await import("./config.js");
    } catch (e) {
      panne("Le fichier config.js est introuvable. Il doit être dans le même dossier que cette page.");
      return;
    }
    let soiree = {};
    try {
      soiree = await import("./evenement.js");
    } catch (e) {
      console.info("evenement.js introuvable : réglages de config.js utilisés.");
    }
    repas = { ...repas, ...(config.repas || {}), ...(soiree.repas || {}) };
    reglagesAffiche = { ...reglagesAffiche, ...(config.affiche || {}), ...(soiree.affiche || {}) };
    appliquerTextes();

    if (!configRemplie(config.firebaseConfig)) {
      panne("Le site n’est pas encore relié à sa base de données. Colle la config Firebase dans config.js.");
      return;
    }
    adresseBase = String(config.firebaseConfig.databaseURL).trim();
    if (!ADRESSE_BASE.test(adresseBase)) {
      panne(`L’adresse databaseURL de config.js n’est pas celle d’une Realtime Database : « ${adresseBase} ». Elle doit avoir la forme https://…firebaseio.com ou https://…firebasedatabase.app.`);
      return;
    }
    try {
      const [app, base] = await Promise.all([
        import(`${SDK}/firebase-app.js`),
        import(`${SDK}/firebase-database.js`),
      ]);
      if (new URLSearchParams(location.search).has("debug") && base.enableLogging) base.enableLogging(true);
      fb = base;
      db = base.getDatabase(app.initializeApp({ ...config.firebaseConfig, databaseURL: adresseBase }));
    } catch (e) {
      panne("Le site n’arrive pas à se charger. Vérifie ta connexion, puis recharge la page.");
      return;
    }
    surveillerConnexion();

    const cle = new URLSearchParams(location.search).get("p");
    if (cle && /^[a-z0-9-]{1,60}$/.test(cle)) {
      try {
        const snap = await avecDelai(fb.get(fb.ref(db, chemin(cle))));
        const d = snap.exists() ? snap.val() : null;
        if (estComplet(d)) {
          invite = { cle, prenom: d.prenom, boisson: d.boisson, heure: d.heure, jeton: d.jeton };
          afficherInvitation(false);
          return;
        }
      } catch (err) {
        ouvrirFormulaire(false);
        afficherErreur("erreur-formulaire", messageBase(err));
        return;
      }
      memoriserDansUrl(null);
    }
    ouvrirFormulaire(false);
  }

  demarrer();
</script>
